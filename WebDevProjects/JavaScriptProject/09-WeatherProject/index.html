<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Search</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-500 text-white flex items-center justify-center min-h-screen">

    <div class="weather-container bg-gray-800 p-6 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-4">Weather Search</h1>
        <div class="search-box flex gap-2 mb-4">
            <input 
                type="text" 
                id="city-input" 
                class="outline-none w-full p-2  rounded-md border border-gray-600 text-black"
                placeholder="Enter city name"
            >
            <button id="search_btn" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">
                Get Weather
            </button>
        </div>
        <div id="weather-info" >
            <!-- Weather details will appear here -->
        </div>
    </div>

    <script src="custom.js"></script>
</body>
</html>
